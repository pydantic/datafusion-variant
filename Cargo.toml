[package]
name = "datafusion-variant"
description = "Variant functions for DataFusion"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Matthew Kim <matthew@pydantic.dev>"]

[dependencies]
datafusion = "55"
arrow = "60"
arrow-schema = "60"
parquet-variant-compute = "60"
parquet-variant-json = "60"
parquet-variant = "60"

[dev-dependencies]
anyhow = "1.0.100"
arrow-cast = "60"
serde_json = "1.0.145"
flate2 = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
datafusion-sqllogictest = "55"
sqllogictest = "0.29"
indicatif = "0.18"
env_logger = "0.11"
insta = "1.43.2"
rustyline = { version = "14.0", features = ["derive"] }

[patch.crates-io]
# DataFusion does not yet have a crates.io release built against arrow 60. Point at the
# pydantic/datafusion `pydantic-main-arrow-60` branch (apache/datafusion `main` past
# https://github.com/apache/datafusion/pull/25335, which moves DataFusion to arrow/parquet
# 60.0.0) so the whole graph resolves to a single arrow 60 major. Drop this patch once a
# DataFusion release ships arrow 60.
datafusion = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-catalog = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-catalog-listing = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-common = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-common-runtime = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-datasource = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-datasource-arrow = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-datasource-avro = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-datasource-csv = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-datasource-json = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-datasource-parquet = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-doc = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-execution = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-expr = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-expr-common = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-functions = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-functions-aggregate = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-functions-aggregate-common = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-functions-nested = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-functions-table = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-functions-window = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-functions-window-common = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-macros = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-optimizer = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-physical-expr = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-physical-expr-adapter = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-physical-expr-common = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-physical-optimizer = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-physical-plan = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-pruning = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-session = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-spark = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-sql = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
datafusion-sqllogictest = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main-arrow-60" }
# arrow-rs: the pydantic/arrow-rs `pydantic-main-arrow-60` branch, which Fusionfire builds
# against. The whole family is patched so only one copy of each arrow crate is in the graph.
arrow = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-arith = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-array = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-avro = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-buffer = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-cast = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-cmp = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-csv = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-data = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-ipc = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-json = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-ord = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-row = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-schema = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-select = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
arrow-string = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
parquet = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
parquet-variant = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
parquet-variant-compute = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
parquet-variant-json = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main-arrow-60" }
